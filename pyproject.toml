[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-imperfect-priors-kill-test"
version = "0.1.0"
description = "Offline, falsifiable kill test for scheduler-only priors in latent causal discovery"
requires-python = ">=3.11"
dependencies = [
  "causal-learn==0.1.4.8",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "psutil>=5.9",
  "pyarrow>=15",
  "PyYAML>=6",
  "scikit-learn>=1.4",
  "scipy>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]
reference = [
  "causality-lab @ git+https://github.com/IntelLabs/causality-lab.git@36625da6eeef059e36dab2b4467235a036136b76",
]

[project.scripts]
kill-test = "safety_prior.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
